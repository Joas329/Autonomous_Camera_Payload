<!DOCTYPE html>
<html>
<head>
    <title>Camera Control Panel</title>
    <style>
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #333;
        }
        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
        }
        button:hover {
            background-color: #45a049;
        }
        .danger {
            background-color: #d9534f;
        }
        #status {
            margin-top: 25px;
            font-size: 20px;
            color: #333;
        }
    </style>
</head>
<body>

<h1>Autonomous Camera Payload Control Panel</h1>

<!-- Buttons -->
<button onclick="sendCommand('/camera/opt/on')">Optical Camera ON</button>
<button class="danger" onclick="sendCommand('/camera/opt/off')">Optical Camera OFF</button>
<br>
<button onclick="sendCommand('/camera/opt/capture')">Capture Image</button>
<br>
<button onclick="sendCommand('/communication/test')">Test API</button>

<div id="status">Status: Waiting for command...</div>

<script>
async function sendCommand(endpoint) {
    const url = "http://localhost:8080" + endpoint;

    try {
        const response = await fetch(url, { method: "POST" });
        const text = await response.text();

        document.getElementById("status").innerText = "Status: " + text;
    } catch (err) {
        document.getElementById("status").innerText = "Error: " + err;
    }
}
</script>

</body>
</html>
